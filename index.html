<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趣味性格测试</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Roboto,sans-serif; }
  body { min-height:100vh; background:linear-gradient(145deg,#f6f0e7 0%,#e8dccc 100%); display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { max-width:700px; width:100%; background:rgba(255,255,255,0.9); border-radius:48px; padding:40px 35px; box-shadow:0 25px 40px -10px rgba(0,0,0,0.2); }
  h1 { font-size:2rem; color:#3b2e26; margin-bottom:12px; }
  h1 span { background:#d9b382; font-size:1.3rem; border-radius:50px; padding:4px 16px; color:#2f241e; }
  .subhead { color:#6b5a4e; font-size:1rem; margin-bottom:30px; border-left:5px solid #d9b382; padding-left:18px; font-style:italic; }
  .pass-gate { background:#fefbf7; border-radius:36px; padding:30px 24px; border:1px solid #ebdfd3; text-align:center; }
  .pass-gate h2 { font-size:1.5rem; color:#3b2e26; margin-bottom:12px; }
  .pass-gate p { color:#7a6a5c; margin-bottom:24px; }
  .input-group { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-bottom:18px; }
  .input-group input { flex:1 1 240px; padding:16px 22px; border:2px solid #e2d5c9; border-radius:60px; font-size:1.1rem; background:white; outline:none; text-align:center; font-weight:500; }
  .input-group input:focus { border-color:#b99a7a; box-shadow:0 0 0 5px #d9b38240; }
  .input-group button { background:#3b2e26; border:none; color:white; padding:16px 38px; border-radius:60px; font-size:1.1rem; font-weight:600; cursor:pointer; }
  .input-group button:hover { background:#5a4133; }
  .error-msg { color:#c2564b; background:#ffeae6; border-radius:60px; padding:12px 16px; font-size:0.95rem; margin-top:8px; display:inline-block; border:1px solid #ffcdc4; }
  .quiz-area { display:none; }
  .progress { display:flex; justify-content:space-between; margin-bottom:22px; background:#fff2e7; padding:12px 22px; border-radius:60px; }
  .progress .current { background:#d9b382; padding:4px 14px; border-radius:40px; font-weight:700; }
  .question-text { font-size:1.6rem; font-weight:600; color:#2f241e; margin-bottom:28px; }
  .options { display:flex; flex-direction:column; gap:14px; margin-bottom:30px; }
  .option-btn { background:white; border:2px solid #ebdfd3; padding:18px 24px; border-radius:60px; font-size:1.1rem; text-align:left; cursor:pointer; display:flex; align-items:center; gap:16px; }
  .option-btn:hover { background:#faf3ed; border-color:#b99a7a; }
  .option-btn.selected { background:#f0e3d6; border-color:#9b7b60; }
  .option-btn .letter { background:#f0e3d6; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:50%; font-weight:700; flex-shrink:0; }
  .option-btn.selected .letter { background:#b99a7a; color:white; }
  .quiz-footer { display:flex; justify-content:space-between; gap:15px; }
  .btn-secondary { background:transparent; border:2px solid #d0bcab; color:#5a4a3e; padding:14px 26px; border-radius:60px; cursor:pointer; }
  .btn-secondary:disabled { opacity:0.4; cursor:not-allowed; }
  .btn-primary { background:#3b2e26; border:none; color:white; padding:16px 38px; border-radius:60px; cursor:pointer; font-weight:600; }
  .btn-primary:hover { background:#5a4133; }
  .result-area { display:none; text-align:center; }
  .result-card { background:#fefbf7; border-radius:40px; padding:34px 28px; border:1px solid #ebdfd3; }
  .result-emoji { font-size:5rem; margin-bottom:12px; }
  .result-title { font-size:2rem; font-weight:800; color:#2f241e; margin-bottom:16px; }
  .result-desc { font-size:1.1rem; color:#5a4a3e; line-height:1.6; margin-bottom:30px; background:#f3ede7; padding:22px; border-radius:28px; }
  .again-btn { background:white; border:2px solid #b99a7a; color:#3b2e26; padding:14px 38px; border-radius:60px; cursor:pointer; font-weight:600; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="card">
  <h1>✨ 性格小测验 <span>专属版</span></h1>
  <div class="subhead">输入专属密码，解锁你的性格分析</div>

  <div id="passGate" class="pass-gate">
    <h2>🔐 请输入密码</h2>
    <p>使用你获得的密码开始测试</p>
    <div class="input-group">
      <input type="text" id="passwordInput" placeholder="请输入密码" autocomplete="off">
      <button id="submitPassBtn">验证</button>
    </div>
    <div id="passError" class="error-msg hidden"></div>
  </div>

  <div id="quizArea" class="quiz-area">
    <div class="progress">
      <span>问题 <span id="currentQNum" class="current">1</span> / <span id="totalQNum">6</span></span>
      <span id="progressPercent">16%</span>
    </div>
    <div id="questionText" class="question-text"></div>
    <div id="optionsContainer" class="options"></div>
    <div class="quiz-footer">
      <button id="prevBtn" class="btn-secondary" disabled>← 上一题</button>
      <button id="nextBtn" class="btn-primary">下一题 →</button>
    </div>
  </div>

  <div id="resultArea" class="result-area">
    <div class="result-card">
      <div id="resultEmoji" class="result-emoji">🌟</div>
      <div id="resultTitle" class="result-title"></div>
      <div id="resultDesc" class="result-desc"></div>
      <button id="restartBtn" class="again-btn">重新测试</button>
    </div>
  </div>
</div>

<script>
const VALID_PASSWORDS = ['XINGZUO-01','XINGZUO-02','XINGZUO-03','XINGZUO-04','XINGZUO-05'];

const questions = [
  { text: "周末的夜晚，你更倾向于？", options: [
    { text: "约朋友去热闹的派对或夜市", scores: { lively:3, warm:1 } },
    { text: "一个人看书、看电影或打游戏", scores: { thoughtful:3, calm:1 } },
    { text: "和两三个好友在家做饭聊天", scores: { warm:3, lively:1 } },
    { text: "规划下周的事情，整理房间", scores: { calm:3, thoughtful:1 } }
  ]},
  { text: "当你遇到一个难题时，你首先会？", options: [
    { text: "立刻动手尝试，边做边想", scores: { lively:2, calm:1 } },
    { text: "先冷静分析，列出所有可能", scores: { thoughtful:3, calm:2 } },
    { text: "找有经验的人聊聊，听听建议", scores: { warm:3, lively:1 } },
    { text: "自己查资料，研究清楚再行动", scores: { thoughtful:2, calm:2 } }
  ]},
  { text: "朋友眼中的你，更接近哪种描述？", options: [
    { text: "开心果，总能活跃气氛", scores: { lively:3, warm:1 } },
    { text: "靠谱的倾听者，善解人意", scores: { warm:3, thoughtful:1 } },
    { text: "独立有主见，不太随大流", scores: { calm:3, thoughtful:1 } },
    { text: "好奇宝宝，喜欢尝试新鲜事物", scores: { lively:2, calm:1 } }
  ]},
  { text: "如果突然得到一笔奖金，你会？", options: [
    { text: "立刻买下心心念念的东西", scores: { lively:3 } },
    { text: "存起来，为未来做规划", scores: { calm:3, thoughtful:1 } },
    { text: "请家人朋友吃大餐、送礼物", scores: { warm:3, lively:1 } },
    { text: "报个课程或投资自己", scores: { thoughtful:3, calm:1 } }
  ]},
  { text: "在团队合作中，你通常扮演什么角色？", options: [
    { text: "点子王，提出各种创意", scores: { lively:3, warm:1 } },
    { text: "执行者，把想法落地", scores: { calm:3, thoughtful:1 } },
    { text: "协调者，关心每个人的感受", scores: { warm:3 } },
    { text: "观察者，在关键时刻给出建议", scores: { thoughtful:3, calm:2 } }
  ]},
  { text: "旅行时，你更喜欢哪种方式？", options: [
    { text: "说走就走，随心探索", scores: { lively:3, calm:1 } },
    { text: "提前做好详细攻略", scores: { thoughtful:3, calm:2 } },
    { text: "和伴侣或好友一起，边走边聊", scores: { warm:3, lively:2 } },
    { text: "一个人安静地感受当地文化", scores: { calm:3, thoughtful:1 } }
  ]}
];

const PERSONALITY_TYPES = [
  { id:'lively', emoji:'⚡', title:'活泼冒险家', desc:'你像一阵清新的风，走到哪里都能带来活力。热爱新鲜事物，行动力超强，身边永远不会无聊。' },
  { id:'thoughtful', emoji:'🧠', title:'沉稳思考者', desc:'你拥有深邃的内心世界，喜欢独立钻研。做事有条理，善于分析，总能一眼看穿问题本质。' },
  { id:'warm', emoji:'🌻', title:'温暖陪伴者', desc:'你温柔而可靠，重视人与人之间的情感联结。总是体贴他人，善于倾听，朋友都喜欢向你倾诉。' },
  { id:'calm', emoji:'🧊', title:'冷静分析家', desc:'你理性、沉着，遇事不慌。喜欢用逻辑和规划解决问题，独立又可靠，是很多人的定海神针。' }
];

const passGate = document.getElementById('passGate');
const quizArea = document.getElementById('quizArea');
const resultArea = document.getElementById('resultArea');
const passwordInput = document.getElementById('passwordInput');
const submitPassBtn = document.getElementById('submitPassBtn');
const passError = document.getElementById('passError');
const currentQNumSpan = document.getElementById('currentQNum');
const totalQNumSpan = document.getElementById('totalQNum');
const progressPercent = document.getElementById('progressPercent');
const questionText = document.getElementById('questionText');
const optionsContainer = document.getElementById('optionsContainer');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resultEmoji = document.getElementById('resultEmoji');
const resultTitle = document.getElementById('resultTitle');
const resultDesc = document.getElementById('resultDesc');
const restartBtn = document.getElementById('restartBtn');

let currentQuestionIndex = 0;
let answers = new Array(questions.length).fill(null);
totalQNumSpan.textContent = questions.length;

function checkPassword(input) {
  const pwd = input.trim().toUpperCase();
  return VALID_PASSWORDS.includes(pwd);
}

submitPassBtn.addEventListener('click', () => {
  const pwd = passwordInput.value;
  if (!pwd.trim()) { passError.textContent = '请输入密码'; passError.classList.remove('hidden'); return; }
  if (!checkPassword(pwd)) { passError.textContent = '密码不正确，请检查后重试'; passError.classList.remove('hidden'); return; }
  passGate.style.display = 'none';
  quizArea.style.display = 'block';
  resetQuizState();
  renderQuestion(0);
});

passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitPassBtn.click(); });
passwordInput.addEventListener('input', () => passError.classList.add('hidden'));

function resetQuizState() { currentQuestionIndex = 0; answers = new Array(questions.length).fill(null); }

function updateProgress() {
  const total = questions.length;
  const current = currentQuestionIndex + 1;
  currentQNumSpan.textContent = current;
  progressPercent.textContent = Math.round((current/total)*100) + '%';
  prevBtn.disabled = currentQuestionIndex === 0;
  nextBtn.textContent = currentQuestionIndex === total-1 ? '查看结果 🎉' : '下一题 →';
}

function renderQuestion(index) {
  currentQuestionIndex = index;
  const q = questions[index];
  questionText.textContent = q.text;
  optionsContainer.innerHTML = '';
  q.options.forEach((opt, optIndex) => {
    const btn = document.createElement('button');
    btn.classList.add('option-btn');
    if (answers[index] === optIndex) btn.classList.add('selected');
    const letterSpan = document.createElement('span');
    letterSpan.classList.add('letter');
    letterSpan.textContent = String.fromCharCode(65 + optIndex);
    btn.appendChild(letterSpan);
    btn.appendChild(document.createTextNode(opt.text));
    btn.addEventListener('click', () => {
      answers[index] = optIndex;
      optionsContainer.querySelectorAll('.option-btn').forEach((b,i) => { b.classList.toggle('selected', i === optIndex); });
    });
    optionsContainer.appendChild(btn);
  });
  updateProgress();
}

function goToNext() {
  if (answers[currentQuestionIndex] === null) { alert('请先选择一个选项哦 😊'); return; }
  if (currentQuestionIndex === questions.length - 1) { showResult(); }
  else { renderQuestion(currentQuestionIndex + 1); }
}

function goToPrev() { if (currentQuestionIndex > 0) renderQuestion(currentQuestionIndex - 1); }
prevBtn.addEventListener('click', goToPrev);
nextBtn.addEventListener('click', goToNext);

function calculatePersonality() {
  const scores = { lively:0, thoughtful:0, warm:0, calm:0 };
  questions.forEach((q, i) => {
    const sel = answers[i];
    if (sel === null) return;
    const opt = q.options[sel];
    if (opt.scores) { for (const [k,v] of Object.entries(opt.scores)) { if (scores[k] !== undefined) scores[k] += v; } }
  });
  let maxType = 'lively', maxScore = -1;
  for (const [type, score] of Object.entries(scores)) { if (score > maxScore) { maxScore = score; maxType = type; } }
  return PERSONALITY_TYPES.find(p => p.id === maxType) || PERSONALITY_TYPES[0];
}

function showResult() {
  quizArea.style.display = 'none';
  resultArea.style.display = 'block';
  const p = calculatePersonality();
  resultEmoji.textContent = p.emoji;
  resultTitle.textContent = p.title;
  resultDesc.textContent = p.desc;
}

restartBtn.addEventListener('click', () => {
  resultArea.style.display = 'none';
  passGate.style.display = 'block';
  passwordInput.value = '';
  passError.classList.add('hidden');
  resetQuizState();
});
</script>
</body>
</html>
